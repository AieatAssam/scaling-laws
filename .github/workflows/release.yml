name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.7.2"
  GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
  TEMPLATES_TPZ: Godot_v4.7.2-stable_export_templates.tpz
  BASE_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

jobs:
  # Tests, then exports the four desktop/web presets and zips them. Dry run: workflow_dispatch on any branch.
  build:
    name: Test and export (macOS, Windows, Linux, Web)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot-bin" "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot/godot.zip" "$BASE_URL/$GODOT_ZIP"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"

      - name: Cache export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-stable

      - name: Download export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tpl" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fsSL -o "$RUNNER_TEMP/tpl/$TEMPLATES_TPZ" "$BASE_URL/$TEMPLATES_TPZ"
          unzip -q -j "$RUNNER_TEMP/tpl/$TEMPLATES_TPZ" 'templates/*' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          rm -f "$RUNNER_TEMP/tpl/$TEMPLATES_TPZ"

      - name: Put Godot on PATH
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          godot --version

      - name: Resolve version and check it matches the project
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VER="${TAG#v}"
            grep -qx "config/version=\"$VER\"" project.godot \
              || { echo "project.godot config/version must be \"$VER\" for tag $TAG"; exit 1; }
            grep -q "application/short_version=\"$VER\"" export_presets.cfg \
              && grep -q "application/version=\"$VER\"" export_presets.cfg \
              && grep -q "version/name=\"$VER\"" export_presets.cfg \
              && grep -q "file_version=\"$VER.0\"" export_presets.cfg \
              || { echo "export_presets.cfg versions must be $VER"; exit 1; }
          else
            TAG="v0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Build tag: $TAG"

      - name: Import assets (pass 1)
        run: godot --headless --path . --import

      - name: Import assets (pass 2)
        run: godot --headless --path . --import

      - name: GUT tests (gate)
        run: |
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gexit 2>&1 | tee gut.log
          grep -q "All tests passed" gut.log

      - name: Smoke test (gate, must print OK)
        run: |
          set -o pipefail
          godot --headless --path . -s tools/smoke.gd 2>&1 | tee smoke.log
          grep -qx "OK" smoke.log

      - name: Export presets
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p build/win build/linux build/web
          godot --headless --path . --export-release "macOS" "build/scaling-laws-$TAG-macos.zip"
          godot --headless --path . --export-release "Windows Desktop" "build/win/ScalingLaws.exe"
          godot --headless --path . --export-release "Linux" "build/linux/ScalingLaws.x86_64"
          godot --headless --path . --export-release "Web" "build/web/index.html"

      - name: Package and verify archives
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          (cd build/win && zip -q "../scaling-laws-$TAG-windows.zip" ScalingLaws.exe ScalingLaws.pck)
          (cd build/linux && zip -q "../scaling-laws-$TAG-linux.zip" ScalingLaws.x86_64 ScalingLaws.pck)
          (cd build/web && zip -q -r "../scaling-laws-$TAG-web.zip" .)
          for z in build/scaling-laws-"$TAG"-*.zip; do
            echo "== $z ($(du -h "$z" | cut -f1))"
            unzip -l "$z" | tail -n +4 | head -n -2 | awk '{print "   " $4}'
          done
          # Required entries
          unzip -l "build/scaling-laws-$TAG-macos.zip" | grep -q "Scaling Laws.app/Contents/MacOS/Scaling Laws"
          unzip -l "build/scaling-laws-$TAG-windows.zip" | grep -q "ScalingLaws.exe"
          unzip -l "build/scaling-laws-$TAG-windows.zip" | grep -q "ScalingLaws.pck"
          unzip -l "build/scaling-laws-$TAG-linux.zip" | grep -q "ScalingLaws.x86_64"
          unzip -l "build/scaling-laws-$TAG-linux.zip" | grep -q "ScalingLaws.pck"
          for f in index.html index.js index.wasm index.pck; do unzip -l "build/scaling-laws-$TAG-web.zip" | grep -q " $f\$"; done
          # Dev-only paths must not be packed (pck stores res:// paths as plain strings)
          for pck in build/win/ScalingLaws.pck build/linux/ScalingLaws.pck build/web/index.pck; do
            for dev in "tools/" "tests/" "addons/gut" "docs/" "art/style_ref" "art/README" "gutconfig" "SPEC.md"; do
              if grep -aq "$dev" "$pck"; then echo "dev path $dev packed into $pck"; exit 1; fi
            done
            grep -aq "art/palette.hex" "$pck" || { echo "palette.hex missing from $pck"; exit 1; }
          done
          chmod +x build/linux/ScalingLaws.x86_64

      - name: Upload desktop and web archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: build/scaling-laws-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload web site for Pages
        uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: build/web
          if-no-files-found: error
          retention-days: 14

  # Debug-signed APK. Best effort: never blocks desktop/web release.
  android:
    name: Android APK (best effort)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot-bin" "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot/godot.zip" "$BASE_URL/$GODOT_ZIP"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"

      - name: Cache export templates
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-stable

      - name: Download export templates
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tpl" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fsSL -o "$RUNNER_TEMP/tpl/$TEMPLATES_TPZ" "$BASE_URL/$TEMPLATES_TPZ"
          unzip -q -j "$RUNNER_TEMP/tpl/$TEMPLATES_TPZ" 'templates/*' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          rm -f "$RUNNER_TEMP/tpl/$TEMPLATES_TPZ"

      - name: Debug keystore and SDK paths
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-}  JAVA_HOME=${JAVA_HOME:-}"
          ls "${ANDROID_HOME:-/nonexistent}/build-tools" || true

      - name: Put Godot on PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Import assets
        run: |
          godot --headless --path . --import
          godot --headless --path . --import

      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/ScalingLaws.apk
          test -s build/android/ScalingLaws.apk
          ls -la build/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/ScalingLaws.apk
          if-no-files-found: error
          retention-days: 14

  # Creates or updates the GitHub Release. Runs only for v* tags, and only if the desktop/web build succeeded.
  publish:
    name: Publish GitHub Release
    needs: [build, android]
    if: ${{ always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download desktop and web archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: release

      - name: Download Android APK (if built)
        id: apk
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release

      - name: Create or update release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          ls -la
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Scaling Laws $TAG" --generate-notes ./*
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

  pages:
    name: Deploy web build to GitHub Pages
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web site
        uses: actions/download-artifact@v4
        with:
          name: web-site
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
