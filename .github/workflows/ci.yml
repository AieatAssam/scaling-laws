name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.7.2"
  GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip

jobs:
  test:
    name: GUT, smoke, simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot-bin" "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"

      - name: Put Godot on PATH
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          "$HOME/godot-bin/godot" --version

      # The first --import pass logs font/theme load errors on a clean .godot/ and the second pass is clean.
      # Both passes must exit 0; the GUT step below is the real gate.
      - name: Import assets (pass 1)
        run: godot --headless --path . --import

      - name: Import assets (pass 2)
        run: godot --headless --path . --import

      - name: GUT tests (gate)
        run: |
          set -o pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gexit 2>&1 | tee gut.log
          grep -q "All tests passed" gut.log

      - name: Smoke test (gate, must print OK)
        run: |
          set -o pipefail
          godot --headless --path . -s tools/smoke.gd 2>&1 | tee smoke.log
          grep -qx "OK" smoke.log

      # TODO: the pacing simulator is still being retuned (its current run fails several gating checks).
      # Remove continue-on-error once `--ending=aligned` passes on main.
      - name: Pacing simulator (advisory)
        continue-on-error: true
        run: godot --headless --path . -s tools/simulate.gd -- --hours=336 --seed=1 --ending=aligned

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            gut.log
            smoke.log
          if-no-files-found: ignore
          retention-days: 7
